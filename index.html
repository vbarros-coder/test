<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wellora — A Safe Space for Mental Health Support</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #0a0a0a;
    }

    .hero {
      position: relative;
      width: 100%;
      min-height: 720px;
      overflow: hidden;
      background-color: #b8c7b2;
    }

    /* Forest background image */
    .hero__bg {
      position: absolute;
      inset: 0;
      background-image: url('https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=2000&q=80');
      background-size: cover;
      background-position: center;
      filter: brightness(1.05) saturate(0.9);
    }

    /* Misty overlay to soften center for text legibility */
    .hero__mist {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 55% at 50% 38%,
        rgba(230,232,225,0.85) 0%,
        rgba(220,225,215,0.55) 45%,
        rgba(180,195,175,0.15) 75%,
        rgba(0,0,0,0) 100%);
    }

    /* Top nav */
    .nav {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 56px;
      max-width: 1280px;
      margin: 0 auto;
    }
    .nav__brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 600;
      color: #0a0a0a;
      letter-spacing: -0.01em;
    }
    .nav__links {
      display: flex;
      align-items: center;
      gap: 40px;
      list-style: none;
      margin: 0;
      padding: 0;
      font-size: 15px;
      color: #0a0a0a;
    }
    .nav__links a {
      color: #0a0a0a;
      text-decoration: none;
      font-weight: 400;
    }
    .nav__links a.is-active {
      font-weight: 600;
      border-bottom: 1.5px solid #0a0a0a;
      padding-bottom: 2px;
    }
    .nav__cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    }

    /* Hero content */
    .hero__content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 72px 24px 0;
      max-width: 920px;
      margin: 0 auto;
    }
    .hero__title {
      font-size: 76px;
      line-height: 1.05;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #0a0a0a;
      margin: 0 0 28px;
      text-wrap: balance;
    }
    .hero__subtitle {
      font-size: 17px;
      line-height: 1.55;
      font-weight: 400;
      color: #0a0a0a;
      max-width: 560px;
      margin: 0 0 40px;
      text-wrap: pretty;
    }
    .hero__cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #ffffff;
      padding: 16px 38px;
      border-radius: 999px;
      font-size: 17px;
      font-weight: 500;
      text-decoration: none;
      box-shadow: 0 12px 28px rgba(0,0,0,0.28);
    }

    @media (max-width: 768px) {
      .nav { padding: 20px 24px; flex-wrap: wrap; gap: 16px; }
      .nav__links { gap: 24px; font-size: 14px; }
      .hero__title { font-size: 44px; }
    }
  </style>
</head>
<body>
  <section class="hero" aria-label="Hero">

    <div class="hero__bg"></div>
    <div class="hero__mist"></div>

    <nav class="nav">
      <div class="nav__brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M3 6 L7 18 L10.5 9 L12 12 L13.5 9 L17 18 L21 6" stroke="#0a0a0a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <span>Wellora</span>
      </div>

      <ul class="nav__links">
        <li><a href="#" class="is-active">Home</a></li>
        <li><a href="#">About Us</a></li>
        <li><a href="#">Resources</a></li>
        <li><a href="#">Community</a></li>
      </ul>

      <a href="#" class="nav__cta">Contact Us</a>
    </nav>

    <div class="hero__content">
      <h1 class="hero__title">A Safe Space for<br>Mental Health Support</h1>
      <p class="hero__subtitle">Connect with people who understand your challenges and receive encouragement throughout your recovery journey.</p>
      <a href="#" class="hero__cta">Join Today</a>
    </div>

  </section>
</body>
</html>
