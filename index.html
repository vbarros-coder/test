<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wellora — A Safe Space for Mental Health Support</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #0a0a0a;
    }

    .hero {
      position: relative;
      width: 100%;
      min-height: 720px;
      overflow: hidden;
      background-color: #b8c7b2;
    }

    /* ---- Animated forest background (the reference image) ---- */
    /* Slow, dramatic Ken-Burns drift — pushes in and pans over ~40s */
    .hero__bg {
      position: absolute;
      inset: -4%;                 /* bleed so edges never show during motion */
      background-image: url('./assets/forest-hero.jpg');
      background-size: cover;
      background-position: center 55%;
      transform-origin: 50% 60%;
      animation: hero-kenburns 44s ease-in-out infinite alternate;
      will-change: transform;
    }
    @keyframes hero-kenburns {
      0%   { transform: scale(1.04) translate3d(0, 0, 0); }
      100% { transform: scale(1.16) translate3d(0, -1.5%, 0); }
    }

    /* Drifting fog layers — two soft radial sheets sliding in opposite
       directions to fake volumetric mist moving through the trees */
    .hero__fog {
      position: absolute;
      inset: -20%;
      pointer-events: none;
      background:
        radial-gradient(50% 40% at 30% 45%, rgba(236,240,233,0.55) 0%, rgba(236,240,233,0) 60%),
        radial-gradient(45% 35% at 70% 55%, rgba(225,232,222,0.45) 0%, rgba(225,232,222,0) 60%),
        radial-gradient(60% 50% at 50% 70%, rgba(214,224,210,0.40) 0%, rgba(214,224,210,0) 65%);
      opacity: 0.9;
      will-change: transform, opacity;
    }
    .hero__fog--a { animation: fog-drift-a 38s ease-in-out infinite alternate; }
    .hero__fog--b {
      animation: fog-drift-b 52s ease-in-out infinite alternate;
      mix-blend-mode: screen;
      opacity: 0.7;
    }
    @keyframes fog-drift-a {
      0%   { transform: translate3d(-3%, 1%, 0) scale(1.05); }
      100% { transform: translate3d(4%, -2%, 0) scale(1.12); }
    }
    @keyframes fog-drift-b {
      0%   { transform: translate3d(3%, -1%, 0) scale(1.1); }
      100% { transform: translate3d(-4%, 2%, 0) scale(1.18); }
    }

    /* Soft, slow pulsing glow rising from the stump in the lower-center */
    .hero__glow {
      position: absolute;
      left: 50%;
      bottom: 14%;
      width: 42%;
      height: 36%;
      transform: translateX(-50%);
      pointer-events: none;
      background: radial-gradient(ellipse 50% 50% at 50% 50%,
        rgba(255,244,214,0.55) 0%,
        rgba(255,236,190,0.28) 35%,
        rgba(255,230,170,0) 70%);
      filter: blur(6px);
      animation: glow-pulse 7s ease-in-out infinite;
      will-change: opacity, transform;
    }
    @keyframes glow-pulse {
      0%, 100% { opacity: 0.55; transform: translateX(-50%) scale(0.96); }
      50%      { opacity: 0.95; transform: translateX(-50%) scale(1.06); }
    }

    /* Misty overlay to soften center for text legibility */
    .hero__mist {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse 70% 55% at 50% 38%,
        rgba(230,232,225,0.85) 0%,
        rgba(220,225,215,0.55) 45%,
        rgba(180,195,175,0.15) 75%,
        rgba(0,0,0,0) 100%);
    }

    /* Respect users who prefer no motion */
    @media (prefers-reduced-motion: reduce) {
      .hero__bg, .hero__fog, .hero__glow { animation: none; }
    }

    /* Top nav */
    .nav {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 56px;
      max-width: 1280px;
      margin: 0 auto;
    }
    .nav__brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 600;
      color: #0a0a0a;
      letter-spacing: -0.01em;
    }
    .nav__links {
      display: flex;
      align-items: center;
      gap: 40px;
      list-style: none;
      margin: 0;
      padding: 0;
      font-size: 15px;
      color: #0a0a0a;
    }
    .nav__links a {
      color: #0a0a0a;
      text-decoration: none;
      font-weight: 400;
    }
    .nav__links a.is-active {
      font-weight: 600;
      border-bottom: 1.5px solid #0a0a0a;
      padding-bottom: 2px;
    }
    .nav__cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    }

    /* Hero content */
    .hero__content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 72px 24px 0;
      max-width: 920px;
      margin: 0 auto;
    }
    .hero__title {
      font-size: 76px;
      line-height: 1.05;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #0a0a0a;
      margin: 0 0 28px;
      text-wrap: balance;
    }
    .hero__subtitle {
      font-size: 17px;
      line-height: 1.55;
      font-weight: 400;
      color: #0a0a0a;
      max-width: 560px;
      margin: 0 0 40px;
      text-wrap: pretty;
    }
    .hero__cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #ffffff;
      padding: 16px 38px;
      border-radius: 999px;
      font-size: 17px;
      font-weight: 500;
      text-decoration: none;
      box-shadow: 0 12px 28px rgba(0,0,0,0.28);
    }

    @media (max-width: 768px) {
      .nav { padding: 20px 24px; flex-wrap: wrap; gap: 16px; }
      .nav__links { gap: 24px; font-size: 14px; }
      .hero__title { font-size: 44px; }
    }
  </style>
</head>
<body>
  <section class="hero" aria-label="Hero">

    <!-- Animated reference forest image -->
    <div class="hero__bg"></div>
    <div class="hero__fog hero__fog--a"></div>
    <div class="hero__fog hero__fog--b"></div>
    <div class="hero__glow"></div>
    <div class="hero__mist"></div>

    <nav class="nav">
      <div class="nav__brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M3 6 L7 18 L10.5 9 L12 12 L13.5 9 L17 18 L21 6" stroke="#0a0a0a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <span>Wellora</span>
      </div>

      <ul class="nav__links">
        <li><a href="#" class="is-active">Home</a></li>
        <li><a href="#">About Us</a></li>
        <li><a href="#">Resources</a></li>
        <li><a href="#">Community</a></li>
      </ul>

      <a href="#" class="nav__cta">Contact Us</a>
    </nav>

    <div class="hero__content">
      <h1 class="hero__title">A Safe Space for<br>Mental Health Support</h1>
      <p class="hero__subtitle">Connect with people who understand your challenges and receive encouragement throughout your recovery journey.</p>
      <a href="#" class="hero__cta">Join Today</a>
    </div>

  </section>
</body>
</html>
