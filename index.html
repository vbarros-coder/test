<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wellora — A Safe Space for Mental Health Support</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #0a0a0a;
    }

    .hero {
      position: relative;
      width: 100%;
      min-height: 720px;
      overflow: hidden;
      /* Deep space base — the void the forest dissolves into */
      background-color: #05070a;
    }

    /* Layer 1 (back): ultra-realistic 3D forest animation from Higgsfield.
       Plays very slowly; sits faintly behind everything to mimic space. */
    .hero__video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* Very faint so it reads as a distant, space-like backdrop */
      opacity: 0.22;
      filter: brightness(0.7) saturate(0.85) contrast(1.05);
      /* Dramatic, ultra-slow drift on top of the slow source video */
      animation: hero-drift 80s ease-in-out infinite alternate;
    }

    /* Layer 2: faint forest still (Higgsfield image) — poster / fallback
       for the video, and an extra atmospheric layer. */
    .hero__bg {
      position: absolute;
      inset: 0;
      background-image: url('./assets/forest-space.jpg');
      background-size: cover;
      background-position: center;
      opacity: 0.18;
      filter: brightness(0.6) saturate(0.8);
      mix-blend-mode: screen;
    }

    /* Layer 3: space vignette + center glow for text legibility */
    .hero__mist {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 55% at 50% 40%,
          rgba(20,30,28,0.45) 0%,
          rgba(10,14,18,0.65) 55%,
          rgba(5,7,10,0.92) 100%),
        radial-gradient(ellipse 60% 45% at 50% 36%,
          rgba(120,150,130,0.10) 0%,
          rgba(0,0,0,0) 70%);
    }

    @keyframes hero-drift {
      from { transform: scale(1.06) translate3d(0, 0, 0); }
      to   { transform: scale(1.14) translate3d(0, -2%, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero__video { animation: none; }
    }

    /* Top nav */
    .nav {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 56px;
      max-width: 1280px;
      margin: 0 auto;
    }
    .nav__brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 600;
      color: #f4f7f3;
      letter-spacing: -0.01em;
    }
    .nav__links {
      display: flex;
      align-items: center;
      gap: 40px;
      list-style: none;
      margin: 0;
      padding: 0;
      font-size: 15px;
      color: #d6ddd4;
    }
    .nav__links a {
      color: #d6ddd4;
      text-decoration: none;
      font-weight: 400;
    }
    .nav__links a.is-active {
      color: #ffffff;
      font-weight: 600;
      border-bottom: 1.5px solid #ffffff;
      padding-bottom: 2px;
    }
    .nav__cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #f4f7f3;
      color: #05070a;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    }

    /* Hero content */
    .hero__content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 72px 24px 0;
      max-width: 920px;
      margin: 0 auto;
    }
    .hero__title {
      font-size: 76px;
      line-height: 1.05;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #ffffff;
      margin: 0 0 28px;
      text-wrap: balance;
      text-shadow: 0 2px 40px rgba(0,0,0,0.55);
    }
    .hero__subtitle {
      font-size: 17px;
      line-height: 1.55;
      font-weight: 400;
      color: #d6ddd4;
      max-width: 560px;
      margin: 0 0 40px;
      text-wrap: pretty;
      text-shadow: 0 1px 24px rgba(0,0,0,0.5);
    }
    .hero__cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #f4f7f3;
      color: #05070a;
      padding: 16px 38px;
      border-radius: 999px;
      font-size: 17px;
      font-weight: 500;
      text-decoration: none;
      box-shadow: 0 12px 28px rgba(0,0,0,0.45);
    }

    @media (max-width: 768px) {
      .nav { padding: 20px 24px; flex-wrap: wrap; gap: 16px; }
      .nav__links { gap: 24px; font-size: 14px; }
      .hero__title { font-size: 44px; }
    }
  </style>
</head>
<body>
  <section class="hero" aria-label="Hero">

    <!-- Layer 1: ultra-realistic, very-slow 3D forest animation (Higgsfield video) -->
    <video class="hero__video" autoplay muted loop playsinline
           poster="./assets/forest-space.jpg" aria-hidden="true">
      <source src="./assets/forest-space.webm" type="video/webm">
      <source src="./assets/forest-space.mp4" type="video/mp4">
    </video>

    <!-- Layer 2: faint forest still (Higgsfield image) -->
    <div class="hero__bg"></div>

    <!-- Layer 3: space vignette + center glow -->
    <div class="hero__mist"></div>

    <nav class="nav">
      <div class="nav__brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M3 6 L7 18 L10.5 9 L12 12 L13.5 9 L17 18 L21 6" stroke="#f4f7f3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <span>Wellora</span>
      </div>

      <ul class="nav__links">
        <li><a href="#" class="is-active">Home</a></li>
        <li><a href="#">About Us</a></li>
        <li><a href="#">Resources</a></li>
        <li><a href="#">Community</a></li>
      </ul>

      <a href="#" class="nav__cta">Contact Us</a>
    </nav>

    <div class="hero__content">
      <h1 class="hero__title">A Safe Space for<br>Mental Health Support</h1>
      <p class="hero__subtitle">Connect with people who understand your challenges and receive encouragement throughout your recovery journey.</p>
      <a href="#" class="hero__cta">Join Today</a>
    </div>

  </section>
</body>
</html>
